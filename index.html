<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker - Dark Glass</title>
    <link rel="stylesheet" href="assets/style/output.css">
</head>
<!-- Background with dark gradient -->
<body class="min-h-screen bg-linear-to-br from-gray-900 via-slate-900 to-black flex items-center justify-center p-4">

    <!-- Main Glass Container (Dark) -->
    <main class="w-full max-w-4xl bg-white/5 backdrop-blur-2xl border border-white/10 shadow-[0_8px_32px_0_rgba(0,0,0,0.6)] rounded-[30px] p-8 md:p-14 transition-all">

        <!-- Title -->
        <h1 class="text-4xl md:text-5xl font-medium text-gray-100 mb-10 drop-shadow-md">
            Task Tracker
        </h1>

        <!-- Add Task Form -->
        <form id="task-form" class="mb-12">
            <!-- Darker Glass Input Wrapper -->
            <div class="flex items-center bg-black/40 backdrop-blur-md border border-white/10 rounded-2xl overflow-hidden shadow-inner p-1">

                <input
                    id="task-input"
                    type="text"
                    placeholder="Start writing and press enter to create task"
                    class="flex-1 min-w-0 px-6 py-5 text-xl md:text-2xl text-gray-200 placeholder-gray-500 bg-transparent outline-none"
                />

                <button
                    type="submit"
                    class="w-20 h-16 mr-1 cursor-pointer bg-white/10 text-gray-200 border border-white/10 rounded-xl text-4xl flex items-center justify-center hover:bg-white/20 transition-all shadow-sm"
                    aria-label="Add task"
                >
                    ↵
                </button>

            </div>
        </form>

        <!-- Task List -->
        <ul id="task-list" class="space-y-0">
        </ul>

    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
